[package]
name = "cyrene-agent-runtime"
version = "0.1.0"
edition = "2021"
description = "Production stateless Agent Runtime in Rust conforming to M5A requirements"
license = "Apache-2.0"

[dependencies]
prost = "0.12"
prost-types = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
futures = "0.3"
cyrene-plugin-contracts = { path = "../../../contracts/rust/cyrene-plugin-contracts" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[[bench]]
name = "agent_bench"
harness = false
