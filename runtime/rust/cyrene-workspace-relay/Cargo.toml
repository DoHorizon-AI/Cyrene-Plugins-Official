[package]
name = "cyrene-workspace-relay"
version = "0.1.0"
edition = "2021"
description = "High-performance network relay proxy for Workspace connections."
license = "Apache-2.0"

[[bin]]
name = "cy-workspace-relay"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
bytes = "1.0"
clap = { version = "4", features = ["derive", "env"] }
cyrene-plugin-contracts = { path = "../../../contracts/rust/cyrene-plugin-contracts", features = ["server"] }
cyrene-workspace-client-sdk = { path = "../../../sdk/rust/cyrene-workspace-client-sdk" }
futures-util = "0.3"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tonic = { version = "0.12", features = ["transport", "tls"] }
tower = { version = "0.4", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4"] }
x509-parser = "0.18"

[dev-dependencies]
tempfile = "3.8"
