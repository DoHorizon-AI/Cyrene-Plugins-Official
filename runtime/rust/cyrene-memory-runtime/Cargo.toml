[package]
name = "cyrene-memory-runtime"
version = "0.1.0"
edition = "2021"
description = "Canonical Memory Provider Runtime for Cyrene (Milestone M5B)"
license = "Apache-2.0"

[dependencies]
prost = "0.12"
prost-types = "0.12"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
cyrene-plugin-contracts = { path = "../../../contracts/rust/cyrene-plugin-contracts" }

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
