[package]
name = "cyrene-workspace-connector"
version = "0.1.0"
edition = "2021"
description = "Autonomous Workspace Connector daemon for Cyrene Plugins executing approved invocations."
license = "Apache-2.0"

[dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
cyrene-plugin-contracts = { path = "../../../contracts/rust/cyrene-plugin-contracts", features = ["server"] }
cyrene-workspace-client-sdk = { path = "../../../sdk/rust/cyrene-workspace-client-sdk" }
cyrene-workspace-product-adapters = { path = "../cyrene-workspace-product-adapters" }
prost-types = "0.13"
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
tonic = { version = "0.12", features = ["transport"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.8"
tokio-stream = { version = "0.1", features = ["net"] }
tower = { version = "0.4", features = ["util"] }
