[package]
name = "cyrene-connector-wecom"
version = "0.2.0"
edition = "2021"
description = "Native Enterprise WeChat (WeCom) Unified Connector in Rust for Cyrene"
license = "Apache-2.0"

[dependencies]
async-trait = "0.1"
futures = "0.3"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync", "net"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tonic = { version = "0.12", default-features = false, features = ["codegen", "prost"] }
tracing = "0.1"
cyrene-plugin-contracts = { path = "../../../contracts/rust/cyrene-plugin-contracts" }

[dev-dependencies]
tempfile = "3"
