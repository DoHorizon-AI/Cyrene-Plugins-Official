[package]
name = "cyrene-workspace-product-adapters"
version = "0.1.0"
edition = "2021"
description = "Catalog-driven generic Product HTTP adapter for Cyrene Workspace Connector composition."
license = "Apache-2.0"

[dependencies]
async-trait = "0.1"
cyrene-plugin-contracts = { path = "../../../contracts/rust/cyrene-plugin-contracts" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tokio = { version = "1.35", features = ["sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }
