[package]
name = "cyrene-computer-runtime"
version = "0.1.0"
edition = "2021"
description = "Bounded Managed Execution and Tool Runtime for Cyrene (Milestone M5C)"
license = "Apache-2.0"

[dependencies]
prost = "0.12"
prost-types = "0.12"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
sha2 = "0.10"
libc = "0.2"
tempfile = "3"
cyrene-plugin-contracts = { path = "../../../contracts/rust/cyrene-plugin-contracts" }

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
