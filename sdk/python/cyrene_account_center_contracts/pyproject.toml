[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyrene-account-center-contracts"
version = "0.1.0"
description = "Plugins-owned account.center.v1 Python DTOs and caller-context signing"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cyrene_account_center_contracts = ["py.typed"]
