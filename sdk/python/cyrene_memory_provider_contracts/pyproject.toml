[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyrene-memory-provider-contracts"
version = "0.1.0"
description = "Plugins-owned memory.provider.v1 Python contracts and codecs"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cyrene_memory_provider_contracts = ["py.typed"]
