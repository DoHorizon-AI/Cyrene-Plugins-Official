syntax = "proto3";

package cyrene.workspace.local.v1;

option java_multiple_files = true;
option java_package = "io.cyrene.proto.workspace.local.v1";

import "cyrene/workspace/product/v2/product_api.proto";

message HealthRequest {}

message HealthResponse {
  bool local_ready = 1;
}

message DiscoverWorkspacesRequest {
  string caller_token = 1;
}

message WorkspaceSummary {
  string workspace_id = 1;
  string display_name = 2;
  repeated string endpoints = 3;
}

message DiscoverWorkspacesResponse {
  repeated WorkspaceSummary workspaces = 1;
}

message ExecuteRequest {
  string workspace_id = 1;
  string caller_token = 2;
  cyrene.workspace.product.v2.ProductApiInvocationV2 invocation = 3;
}

message ExecuteResponse {
  bool success = 1;
  cyrene.workspace.product.v2.ProductApiResponseV2 product_response = 2;
  string error_message = 3;
}

service WorkspaceSidecarService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc DiscoverWorkspaces(DiscoverWorkspacesRequest) returns (DiscoverWorkspacesResponse);
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
}
