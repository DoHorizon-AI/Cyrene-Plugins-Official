version: v2

modules:
  - path: proto

lint:
  use:
    - STANDARD
  # DirectPluginRuntime is an already-published generic envelope. Renaming the
  # service or duplicating the shared invocation request would break existing
  # clients without improving capability payload ownership.
  except:
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - SERVICE_SUFFIX
  # This vendored Google compatibility proto keeps its upstream `google.rpc`
  # package; changing it would break public type URLs in generated clients.
  ignore:
    - google/rpc/status.proto

breaking:
  use:
    - FILE
