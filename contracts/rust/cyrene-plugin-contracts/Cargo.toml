[package]
name = "cyrene-plugin-contracts"
version = "0.1.0"
edition = "2021"
description = "Generated Rust projections for Cyrene Plugin-owned capability payload contracts."
license = "Apache-2.0"

[lib]
name = "cyrene_plugin_contracts"
path = "src/lib.rs"

[features]
default = ["server"]
server = ["tonic/server"]

[dependencies]
prost = "0.13"
prost-types = "0.13"
tonic = { version = "0.12", default-features = false, features = ["codegen", "prost"] }

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"
tonic-build = "0.12"
