[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "cyrene-knowledge-preparation"
version = "0.1.0"
description = "Deterministic dataset.knowledge.v1 package builder and standalone reference consumer."
requires-python = ">=3.11"
dependencies = ["cyrene-plugin-runtime>=0.2,<0.3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
cyrene-knowledge-reference = "knowledge_reference:_main"

[tool.setuptools]
py-modules = ["knowledge_preparation", "knowledge_reference"]

[tool.setuptools.data-files]
"share/cyrene/plugins/cyrene.tools.knowledge-preparation" = [
  "plugin.manifest.json",
  "contracts/v1/schema.json",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
