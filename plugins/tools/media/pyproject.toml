[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyrene-media-library"
version = "0.1.0"
description = "Persistent image media library with content integrity and PNG card rendering."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "cyrene-plugin-runtime>=0.2,<0.3",
  "cyrene-tool-provider-contracts>=0.1,<0.2",
  "cyrene-integration-contracts>=0.1,<0.2",
  "Pillow>=10.4,<13",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/cyrene/plugins/cyrene.tools.media" = [
  "plugin.manifest.json",
  "configuration.schema.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
