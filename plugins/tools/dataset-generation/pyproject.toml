[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "cyrene-dataset-generation"
version = "0.1.0"
description = "Deterministic SFT bundle building and controlled grounded QA generation"
requires-python = ">=3.11"
dependencies = [
  "cyrene-plugin-runtime>=0.2,<0.3",
  "cyrene-model-provider-contracts>=0.1,<0.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
py-modules = ["dataset_generation"]

[tool.setuptools.data-files]
"share/cyrene/plugins/cyrene.tools.dataset-generation" = [
  "plugin.manifest.json",
  "contracts/v1/schema.json",
  "contracts/v1/configuration.schema.json",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
