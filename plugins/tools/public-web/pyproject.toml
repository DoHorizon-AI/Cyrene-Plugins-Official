[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "cyrene-public-web-tools"
version = "0.1.0"
description = "Bounded public web search, page reading, and source-backed document extraction"
requires-python = ">=3.11"
dependencies = [
  "cyrene-integration-contracts>=0.1,<0.2",
  "cyrene-plugin-runtime>=0.2,<0.3",
  "cyrene-tool-provider-contracts>=0.1,<0.2",
  "cryptography>=44,<51",
  "httpx>=0.28,<0.29",
  "jsonschema>=4.23,<5",
  "openpyxl>=3.1,<4",
  "Pillow>=10,<13",
  "pypdfium2>=4.30,<6",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/cyrene/plugins/cyrene.tools.public-web" = [
  "plugin.manifest.json",
  "configuration.schema.json",
]

[tool.uv.sources]
cyrene-integration-contracts = { path = "../../../sdk/python/cyrene_integration_contracts" }
cyrene-plugin-runtime = { path = "../../../sdk/python/cyrene_plugin_runtime" }
cyrene-tool-provider-contracts = { path = "../../../sdk/python/cyrene_tool_provider_contracts" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
