[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "cyrene-llm-judge"
version = "0.1.0"
description = "Model-backed evaluation.runner.v1 judge (pointwise + pairwise)"
requires-python = ">=3.11"
dependencies = [
  "cyrene-plugin-runtime>=0.2,<0.3",
  "cyrene-model-provider-contracts>=0.1,<0.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
py-modules = ["llm_judge"]

[tool.setuptools.data-files]
"share/cyrene/plugins/cyrene.evaluation.llm-judge" = [
  "plugin.manifest.json",
  "contracts/v1/schema.json",
  "contracts/v1/configuration.schema.json",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
