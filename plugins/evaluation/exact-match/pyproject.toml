[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "cyrene-exact-match-evaluator"
version = "0.1.0"
description = "Exact-match implementation of evaluation.runner.v1"
requires-python = ">=3.11"
dependencies = ["cyrene-plugin-runtime>=0.2,<0.3"]

[tool.setuptools]
py-modules = ["exact_match_evaluator"]

[tool.setuptools.data-files]
"share/cyrene/plugins/cyrene.evaluation.exact-match" = ["plugin.manifest.json"]
