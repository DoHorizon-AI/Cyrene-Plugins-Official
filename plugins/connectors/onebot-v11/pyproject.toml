[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyrene-onebot-v11-connector"
version = "0.2.0"
description = "OneBot v11 and direct QQNT implementations of Cyrene connector capabilities"
requires-python = ">=3.11"
dependencies = [
  "cyrene-plugin-runtime>=0.2,<0.3",
  "grpcio>=1.62,<1.63",
  "protobuf>=4.21,<5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.data-files]
"share/cyrene/plugins/cyrene.connectors.onebot-v11" = [
  "plugin.manifest.json",
  "package-descriptor.json",
  "configuration.schema.json"
]
"share/cyrene/plugins/cyrene.connectors.onebot-v11/contracts/v1" = [
  "contracts/v1/schema.json"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["src/onebot_v11_connector/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
