[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyrene-wecom-connector"
version = "0.3.0"
description = "Unified WeCom message and tools connector with canonical inbound delivery"
requires-python = ">=3.11"
dependencies = ["grpcio>=1.62,<1.63", "protobuf>=4.21,<5", "websockets>=12,<18"]

[project.optional-dependencies]
bindings = ["grpcio-tools==1.62.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.data-files]
"share/cyrene/plugins/cyrene.connectors.wecom" = [
  "plugin.manifest.json",
  "configuration.schema.json",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["src/wecom_connector/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
