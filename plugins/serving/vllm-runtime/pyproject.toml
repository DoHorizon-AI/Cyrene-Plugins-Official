[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "cyrene-vllm-runtime"
version = "0.1.0"
description = "Plugins-owned vLLM serving execution runtime for Reactor serving bindings"
requires-python = ">=3.11"
dependencies = [
  "cyrene-artifacts @ git+https://github.com/DoHorizon-AI/Cyrene-Platform.git@c59be6f2bd82489fbe933dadff84fc589e00afd9#subdirectory=sdk/python/cyrene_artifacts",
]

[project.scripts]
cyrene-vllm-runtime = "vllm_runtime:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
py-modules = ["vllm_runtime"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
