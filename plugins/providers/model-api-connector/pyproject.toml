[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "cyrene-model-api-connector"
version = "0.1.0"
description = "OpenAI-compatible model.provider.v1 connector for one configured upstream endpoint"
requires-python = ">=3.11"
dependencies = [
  "cyrene-plugin-runtime>=0.2,<0.3",
  "cyrene-model-provider-contracts>=0.1,<0.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.data-files]
"share/cyrene/plugins/cyrene.providers.model-api-connector" = [
  "plugin.manifest.json",
  "configuration.schema.json",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
