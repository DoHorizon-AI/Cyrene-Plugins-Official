[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyrene-knowledge-graph-provider"
version = "0.1.0"
description = "Persistent tenant-isolated SQLite implementation of knowledge.graph.v1"
requires-python = ">=3.11"
dependencies = [
  "cyrene-knowledge-graph-contracts==0.1.0",
  "cyrene-plugin-runtime==0.2.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.9,<1", "jsonschema>=4.23,<5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.data-files]
"share/cyrene/plugins/cyrene.providers.knowledge-graph" = [
  "plugin.manifest.json",
  "configuration.schema.json",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
cyrene-knowledge-graph-contracts = { path = "../../../sdk/python/cyrene_knowledge_graph_contracts" }
cyrene-plugin-runtime = { path = "../../../sdk/python/cyrene_plugin_runtime" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/knowledge_graph_provider/_generated/*.py" = ["E501", "E712", "I001", "UP009"]
