[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyrene-knowledge-retrieval-provider"
version = "0.1.0"
description = "Policy-filtered BM25 retrieval for CYRENE_KNOWLEDGE_BUNDLE_V1 packages"
requires-python = ">=3.11"
dependencies = [
  "cyrene-integration-contracts==0.1.0",
  "cyrene-plugin-runtime==0.2.2",
  "cyrene-tool-provider-contracts==0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.9,<1", "jsonschema>=4.23,<5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.data-files]
"share/cyrene/plugins/cyrene.providers.knowledge-retrieval" = [
  "plugin.manifest.json",
  "configuration.schema.json",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
cyrene-integration-contracts = { path = "../../../sdk/python/cyrene_integration_contracts" }
cyrene-plugin-runtime = { path = "../../../sdk/python/cyrene_plugin_runtime" }
cyrene-tool-provider-contracts = { path = "../../../sdk/python/cyrene_tool_provider_contracts" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
