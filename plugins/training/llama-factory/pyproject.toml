[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "cyrene-llama-factory"
version = "0.1.0"
description = "LLaMA-Factory implementation of training.llama-factory.v1"
requires-python = ">=3.11"
dependencies = ["cyrene-plugin-runtime>=0.2,<0.3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
py-modules = ["llama_factory"]

[tool.setuptools.data-files]
"share/cyrene/plugins/cyrene.training.llama-factory" = [
  "plugin.manifest.json",
  "contracts/v1/schema.json",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]