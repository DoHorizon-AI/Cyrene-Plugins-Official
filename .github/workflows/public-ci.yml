name: public-ci

on:
  push:
    branches:
      - main
      - develop
      - release
  pull_request:
    branches:
      - main
      - develop
      - release
  repository_dispatch:
    types:
      - qq-real-smoke
      - onebot-real-smoke

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CI: "true"

jobs:
  source-hygiene:
    name: public-ci / source-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install manifest validation dependency
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.23.0
      - name: Verify exported source manifest
        run: >-
          python3 tools/ci/verify_source_manifest.py
          --root .
          --allow-git-metadata
      - name: Validate plugin manifests against the schema
        run: python3 tools/ci/validate_manifests.py --root .
      - name: Verify the capability index is current
        run: python3 tools/ci/capability_catalog.py --root . --check
      - name: Verify public repository metadata and hygiene
        run: python3 tools/ci/check_public_repository.py
      - name: Verify QQNT direct dependency boundary
        run: >-
          python3 plugins/connectors/onebot-v11/tools/verify_direct_dependency_boundary.py
          --root .
      - name: Scan the exported source for credentials
        run: >-
          docker run --rm
          -v "$PWD:/source:ro"
          zricethezav/gitleaks:v8.30.0
          detect --source=/source --no-git --redact --verbose
      - name: Generate source and dependency SBOMs
        run: |
          set -euo pipefail
          sbom_root="$RUNNER_TEMP/cyrene-source-sbom"
          mkdir -p "$sbom_root"
          docker run --rm \
            -v "$PWD:/source:ro" \
            -v "$sbom_root:/output" \
            ghcr.io/anchore/syft:v1.51.1@sha256:95fe0835e5bebc6f8b1f8acef68d47d63d594ef4c0f25c097ff853b23cbac74c \
            scan dir:/source \
            -o spdx-json=/output/source.spdx.json \
            -o cyclonedx-json=/output/source.cdx.json
          python3 - "$sbom_root" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          spdx = json.loads((root / "source.spdx.json").read_text(encoding="utf-8"))
          cyclonedx = json.loads((root / "source.cdx.json").read_text(encoding="utf-8"))
          if spdx.get("spdxVersion") != "SPDX-2.3" or not spdx.get("packages"):
              raise SystemExit("source SPDX SBOM is missing packages")
          if cyclonedx.get("bomFormat") != "CycloneDX" or not cyclonedx.get("components"):
              raise SystemExit("source CycloneDX SBOM is missing components")
          PY
      - name: Upload source and dependency SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: cyrene-source-sbom-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/cyrene-source-sbom
          if-no-files-found: error
          compression-level: 0
      - name: Install Python runtime test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check pytest ruff jsonschema==4.23.0
          python3 -m pip install --disable-pip-version-check \
            -e sdk/python/cyrene_model_provider_contracts \
            -e sdk/python/cyrene_plugin_runtime \
            -e plugins/connectors/onebot-v11 \
          -e plugins/connectors/wecom \
            -e plugins/evaluation/exact-match \
          -e plugins/evaluation/evaluator-pack \
          -e plugins/evaluation/llm-judge \
            -e plugins/models/hf-model-analyzer \
            -e plugins/policy/compat-rules \
            -e plugins/tools/dataset-preparation \
            -e plugins/tools/dataset-validator
      - name: Lint Python runtime and official Plugin sources
        run: |
          python3 -m ruff check \
            --exclude '**/_generated/**' \
            sdk/python/cyrene_model_provider_contracts/src \
            sdk/python/cyrene_plugin_runtime/src \
            plugins/connectors/onebot-v11/src \
            plugins/connectors/onebot-v11/tools \
            tools/ci/publish_onebot_native_aot.py \
            tools/ci/assemble_onebot_reference.py \
            tools/ci/onebot_reference_parity.py \
            tools/ci/onebot_real_smoke.py \
            tools/ci/benchmark_onebot_native_aot.py \
            tools/ci/exercise_onebot_native_transports.py \
            tools/ci/exercise_onebot_native_qqnt.py \
            plugins/connectors/wecom \
            plugins/evaluation/exact-match \
            plugins/evaluation/evaluator-pack \
            plugins/evaluation/llm-judge \
            plugins/models/hf-model-analyzer \
            plugins/policy/compat-rules \
            plugins/tools/dataset-preparation \
            plugins/tools/dataset-validator \
            tools/ci/capability_catalog.py \
            tools/ci/update_source_manifest.py \
            tools/ci/validate_manifests.py \
            tools/ci/verify_source_manifest.py
      - name: Run Python runtime and official Plugin tests
        run: |
          python3 -m pytest -q \
            sdk/python/cyrene_plugin_runtime/tests \
            plugins/connectors/onebot-v11/tests \
            plugins/connectors/wecom/tests \
            plugins/evaluation/evaluator-pack/tests \
            plugins/evaluation/llm-judge/tests \
            plugins/tools/dataset-preparation/tests \
            plugins/tools/dataset-validator/tests
      - name: Verify Python/native behavior matrix
        run: python3 plugins/connectors/onebot-v11/tools/verify_behavior_matrix.py

  onebot-v11-package:
    name: public-ci / onebot-v11-package
    needs:
      - source-hygiene
      - dotnet-native-aot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: cyrene-onebot-v11-native-*
          path: ${{ runner.temp }}/cyrene-onebot-v11-native
          merge-multiple: false
      - name: Promote the tested Native AOT package as the formal package
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/cyrene-onebot-v11-package"
          mkdir -p "$output"
          count=0
          while IFS= read -r archive; do
            cp "$archive" "$output/$(basename "$archive")"
            unzip -t "$archive"
            count=$((count + 1))
          done < <(find "$RUNNER_TEMP/cyrene-onebot-v11-native" -type f \
            -name 'cyrene-onebot-v11-native-*.zip' -print | sort)
          test "$count" -eq 2
          sha256sum "$output"/*.zip > "$output/cyrene-onebot-v11-native.zip.sha256"
      - name: Verify candidate outside the source checkout
        run: |
          set -euo pipefail
          for archive in "$RUNNER_TEMP"/cyrene-onebot-v11-package/*.zip; do
            package_root="$RUNNER_TEMP/cyrene-onebot-v11-package/unpacked/$(basename "$archive" .zip)"
            mkdir -p "$package_root"
            unzip -q "$archive" -d "$package_root"
            test -f "$package_root/plugin.manifest.json"
            test -f "$package_root/NATIVE_AOT_OPERATIONS.md"
            test -x "$package_root/bin/cyrene-onebot-v11"
            ! find "$package_root" -type f \( -name '*.py' -o -name '*.pyc' \) -print -quit | grep -q .
            python3 - "$package_root" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          manifest = json.loads((root / "plugin.manifest.json").read_text())
          assert manifest["version"] == "0.3.0"
          assert manifest["runtime"]["language"] == "csharp"
          assert manifest["runtime"]["launch"] == {"executable": "bin/cyrene-onebot-v11"}
          assert "requiresPython" not in manifest["compatibility"]
          descriptor = json.loads((root / "package-descriptor.json").read_text())
          assert descriptor["runtime"]["kind"] == "native-executable"
          assert descriptor["dependencies"]["lock"]["status"] == "NOT_REQUIRED"
          PY
          done
      - name: Upload immutable package candidate
        uses: actions/upload-artifact@v4
        with:
          name: cyrene-onebot-v11-package-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/cyrene-onebot-v11-package
          if-no-files-found: error
          compression-level: 0

  onebot-v11-python-rollback:
    name: public-ci / onebot-v11-python-rollback
    needs: source-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked OneBot rollback dependencies
        run: |
          python3 -m pip install --disable-pip-version-check pytest
          python3 -m pip install --disable-pip-version-check \
            --requirement plugins/connectors/onebot-v11/requirements.lock
      - name: Assemble deterministic Python rollback package
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/cyrene-onebot-v11-python-rollback"
          mkdir -p "$output"
          python3 plugins/connectors/onebot-v11/tools/assemble_package.py \
            --repository-root . \
            --output "$output/cyrene-onebot-v11-python-0.2.0.zip"
          unzip -t "$output/cyrene-onebot-v11-python-0.2.0.zip"
          sha256sum "$output/cyrene-onebot-v11-python-0.2.0.zip" > "$output/cyrene-onebot-v11-python-0.2.0.zip.sha256"
      - name: Verify rollback artifact outside the source checkout
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/cyrene-onebot-v11-python-rollback/unpacked"
          mkdir -p "$package_root"
          unzip -q "$RUNNER_TEMP/cyrene-onebot-v11-python-rollback/cyrene-onebot-v11-python-0.2.0.zip" -d "$package_root"
          test -f "$package_root/src/cyrene_plugin_runtime/bootstrap.py"
          test -f "$package_root/src/onebot_v11_connector/plugin.py"
          ! find "$package_root" -type f \( -name '*.pyc' -o -path '*/__pycache__/*' \) -print -quit | grep -q .
          PYTHONPATH="$package_root/src" python3 -c \
            'import cyrene_plugin_runtime.bootstrap; import onebot_v11_connector.plugin'
      - name: Run installed rollback artifact vertical gate
        env:
          PYTHONPATH: sdk/python/cyrene_plugin_runtime/src
        run: >-
          python3 -m pytest -q
          plugins/connectors/onebot-v11/tests/test_package.py
          -k installed_artifact
      - name: Upload immutable Python rollback artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyrene-onebot-v11-python-rollback-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/cyrene-onebot-v11-python-rollback
          if-no-files-found: error
          compression-level: 0

  onebot-v11-python-reference:
    name: public-ci / onebot-v11-python-reference
    needs: source-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Assemble immutable Python reference artifact
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/cyrene-onebot-v11-python-reference"
          mkdir -p "$output"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct "$GITHUB_SHA")"
          python3 tools/ci/assemble_onebot_reference.py \
            --repository-root . \
            --output "$output/cyrene-onebot-v11-python-reference-0.2.0.zip"
          unzip -t "$output/cyrene-onebot-v11-python-reference-0.2.0.zip"
          sha256sum "$output/cyrene-onebot-v11-python-reference-0.2.0.zip" \
            > "$output/cyrene-onebot-v11-python-reference-0.2.0.zip.sha256"
      - name: Verify immutable reference metadata
        env:
          EXPECTED_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cyrene-onebot-v11-python-reference/cyrene-onebot-v11-python-reference-0.2.0.zip"
          python3 - "$archive" "$EXPECTED_SOURCE_REVISION" <<'PY'
          import json
          import sys
          import zipfile

          archive_path, expected_revision = sys.argv[1:]
          with zipfile.ZipFile(archive_path) as archive:
              manifest = json.loads(archive.read("reference-manifest.json"))
              names = set(archive.namelist())
          assert manifest["schema"] == "cyrene.onebot.python-reference.v1"
          assert manifest["source_revision"] == expected_revision
          assert manifest["formal_runtime"] == "csharp-native-aot"
          assert manifest["reference_runtime"] == "python"
          assert manifest["qqnt_real_smoke"] == "NOT_RUN"
          assert "src/onebot_v11_connector/plugin.py" in names
          assert "reference-runner/onebot_reference_parity.py" in names
          assert "reference-sbom.json" in names
          assert "reference-build-proof.json" in names
          assert not any(name.endswith(".pyc") for name in names)
          PY
      - name: Upload immutable Python reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyrene-onebot-v11-python-reference-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/cyrene-onebot-v11-python-reference
          if-no-files-found: error
          compression-level: 0

  qq-host-tck:
    name: public-ci / qq-host-tck
    needs: source-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: plugins/connectors/onebot-v11/src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install QQ Host TCK dependencies
        run: |
          python3 -m pip install --disable-pip-version-check pytest
          python3 -m pip install --disable-pip-version-check \
            --requirement plugins/connectors/onebot-v11/requirements.lock
          python3 -m pip install --disable-pip-version-check \
            -e sdk/python/cyrene_plugin_runtime
      - name: Run named QQ Host contract TCK
        run: python3 -m pytest -q plugins/connectors/onebot-v11/tests/test_qqnt_host_tck.py

  onebot-real-smoke:
    name: public-ci / onebot-real-smoke / linux-x64
    if: >-
      github.event_name == 'repository_dispatch' &&
      github.event.action == 'onebot-real-smoke' &&
      github.ref == 'refs/heads/main'
    needs: onebot-v11-package
    runs-on: [self-hosted, linux, x64, onebot-real]
    environment:
      name: onebot-real-smoke
    timeout-minutes: 45
    env:
      ONEBOT_REAL_SMOKE_APPROVED: ${{ vars.ONEBOT_REAL_SMOKE_APPROVED }}
      ONEBOT_REAL_HTTP_BASE_URL: ${{ vars.ONEBOT_REAL_HTTP_BASE_URL }}
      ONEBOT_REAL_FORWARD_WEBSOCKET_URL: ${{ vars.ONEBOT_REAL_FORWARD_WEBSOCKET_URL }}
      ONEBOT_REAL_REVERSE_LISTEN_HOST: ${{ vars.ONEBOT_REAL_REVERSE_LISTEN_HOST }}
      ONEBOT_REAL_REVERSE_LISTEN_PORT: ${{ vars.ONEBOT_REAL_REVERSE_LISTEN_PORT }}
      ONEBOT_REAL_ACCOUNT_ID: ${{ vars.ONEBOT_REAL_ACCOUNT_ID }}
      ONEBOT_REAL_CONVERSATION_ID: ${{ vars.ONEBOT_REAL_CONVERSATION_ID }}
      ONEBOT_REAL_CONVERSATION_KIND: ${{ vars.ONEBOT_REAL_CONVERSATION_KIND }}
      ONEBOT_REAL_MARKER_PREFIX: ${{ vars.ONEBOT_REAL_MARKER_PREFIX }}
      ONEBOT_REAL_EVENT_TIMEOUT_SECONDS: ${{ vars.ONEBOT_REAL_EVENT_TIMEOUT_SECONDS }}
      ONEBOT_REAL_ACCESS_TOKEN: ${{ secrets.ONEBOT_REAL_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify protected Linux x64 runner
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: cyrene-onebot-v11-package-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/onebot-real-input
      - name: Extract the tested Linux x64 package
        id: package
        run: |
          set -euo pipefail
          archive="$(find "$RUNNER_TEMP/onebot-real-input" -type f \
            -name '*linux-x64*.zip' -print -quit)"
          test -n "$archive"
          package_root="$RUNNER_TEMP/onebot-real-package"
          mkdir -p "$package_root"
          unzip -q "$archive" -d "$package_root"
          binary="$package_root/bin/cyrene-onebot-v11"
          test -x "$binary"
          printf 'binary=%s\n' "$binary" >> "$GITHUB_OUTPUT"
      - name: Install protected smoke dependencies
        run: |
          python3 -m pip install --disable-pip-version-check \
            'grpcio>=1.62,<1.63' \
            'protobuf>=4.21,<5'
      - name: Run authorized real OneBot smoke
        env:
          ONEBOT_REAL_SMOKE_EVIDENCE: ${{ runner.temp }}/onebot-real-smoke/evidence.json
        run: >-
          python3 tools/ci/onebot_real_smoke.py
          --binary "${{ steps.package.outputs.binary }}"
          --evidence "$ONEBOT_REAL_SMOKE_EVIDENCE"
      - name: Upload redacted OneBot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyrene-onebot-real-smoke-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/onebot-real-smoke/evidence.json
          if-no-files-found: warn
          compression-level: 0

  buf-contracts:
    name: public-ci / buf-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.45.0"
          github_token: ${{ github.token }}
      - name: Lint and format protobuf contracts
        working-directory: contracts
        run: |
          buf lint
          buf format --diff --exit-code
          buf build

  rust-native:
    name: public-ci / rust-native
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format, lint, and test Rust crates
        run: |
          set -euo pipefail
          for manifest in \
            contracts/rust/cyrene-plugin-contracts/Cargo.toml \
            runtime/rust/cyrene-agent-runtime/Cargo.toml \
            runtime/rust/cyrene-memory-runtime/Cargo.toml \
            runtime/rust/cyrene-computer-runtime/Cargo.toml \
            runtime/rust/cyrene-mcp-provider/Cargo.toml \
            runtime/rust/cyrene-plugin-cabi/Cargo.toml \
            runtime/rust/cyrene-plugin-server/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" --check
            cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
            cargo test --manifest-path "$manifest"
          done
      - name: Build Rust server and C ABI
        run: |
          cargo build --release --manifest-path runtime/rust/cyrene-plugin-server/Cargo.toml
          cargo build --release --manifest-path runtime/rust/cyrene-plugin-cabi/Cargo.toml
      - name: Run the pure C ABI harness
        run: |
          set -euo pipefail
          native_root="$RUNNER_TEMP/cyrene-rust-native"
          mkdir -p "$native_root/bin" "$native_root/lib" "$native_root/tests"
          cp runtime/rust/cyrene-plugin-server/target/release/cyrene-plugin-server "$native_root/bin/"
          cp runtime/rust/cyrene-plugin-cabi/target/release/librust_cyrene_plugin.so "$native_root/lib/"
          cc -std=c11 -Wall -Wextra -Werror -Wpedantic -Wshadow -pthread \
            contracts/cabi/tests/cabi_harness.c -ldl \
            -o "$native_root/tests/cabi_harness"
          "$native_root/tests/cabi_harness" "$native_root/lib/librust_cyrene_plugin.so"
      - name: Upload Rust build evidence
        uses: actions/upload-artifact@v4
        with:
          name: cyrene-rust-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/cyrene-rust-native
          if-no-files-found: error
          compression-level: 0

  dotnet-native-aot:
    name: public-ci / dotnet-native-aot (${{ matrix.rid }})
    needs: rust-native
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: win-x64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Add MSVC symbol tools to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' |
            Select-Object -First 1
          if (-not $dumpbin) {
            throw 'dumpbin.exe was not found in the hosted Visual Studio installation.'
          }
          Split-Path -Parent $dumpbin | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Run provider tests
        run: dotnet test runtime/dotnet-native-aot/Cyrene.Provider.Tests/Cyrene.Provider.Tests.csproj --configuration Release
      - name: Run OneBot Native AOT contract and parity tests
        if: runner.os != 'Windows'
        run: >-
          dotnet test
          runtime/dotnet-native-aot/Cyrene.OneBot.V11.Tests/Cyrene.OneBot.V11.Tests.csproj
          --configuration Release
          /p:TreatWarningsAsErrors=true
      - name: Run generic OneBot Native AOT tests on Windows
        if: runner.os == 'Windows'
        run: >-
          dotnet test
          runtime/dotnet-native-aot/Cyrene.OneBot.V11.Tests/Cyrene.OneBot.V11.Tests.csproj
          --configuration Release
          /p:TreatWarningsAsErrors=true
          --filter "FullyQualifiedName!~DispatcherTests&FullyQualifiedName!~QqHostParityTests"
      - name: Verify Native AOT source rules
        run: python tools/check_dotnet_aot_rules.py
      - name: Publish and smoke-test all Native AOT components
        run: python tools/ci/publish_native_aot.py --rid "${{ matrix.rid }}" --output-dir "${{ runner.temp }}/cyrene-dotnet-native/${{ matrix.rid }}"
      - name: Upload Native AOT evidence
        uses: actions/upload-artifact@v4
        with:
          name: cyrene-dotnet-${{ matrix.rid }}-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/cyrene-dotnet-native/${{ matrix.rid }}
          if-no-files-found: error
          compression-level: 0
      - name: Install OneBot Native AOT smoke-test dependencies
        if: startsWith(matrix.rid, 'linux-')
        run: >-
          python -m pip install --disable-pip-version-check
          --requirement plugins/connectors/onebot-v11/requirements.lock
      - name: Publish and exercise OneBot Native AOT package
        if: startsWith(matrix.rid, 'linux-')
        run: >-
          python tools/ci/publish_onebot_native_aot.py
          --rid "${{ matrix.rid }}"
          --output-dir "${{ runner.temp }}/cyrene-onebot-v11-native/${{ matrix.rid }}"
      - name: Exercise packaged OneBot WebSocket profiles and subscriptions
        if: startsWith(matrix.rid, 'linux-')
        run: >-
          python tools/ci/exercise_onebot_native_transports.py
          --binary
          "${{ runner.temp }}/cyrene-onebot-v11-native/${{ matrix.rid }}/unpacked/bin/cyrene-onebot-v11"
          --rid "${{ matrix.rid }}"
          --evidence
          "${{ runner.temp }}/cyrene-onebot-v11-native/${{ matrix.rid }}/transport-evidence.json"
      - name: Exercise packaged qqnt-direct profile and QQ Host boundary
        if: matrix.rid == 'linux-x64'
        run: >-
          python tools/ci/exercise_onebot_native_qqnt.py
          --binary
          "${{ runner.temp }}/cyrene-onebot-v11-native/${{ matrix.rid }}/unpacked/bin/cyrene-onebot-v11"
          --rid "${{ matrix.rid }}"
          --evidence
          "${{ runner.temp }}/cyrene-onebot-v11-native/${{ matrix.rid }}/qqnt-evidence.json"
      - name: Record descriptive Native AOT performance sample
        if: matrix.rid == 'linux-x64'
        run: >-
          python tools/ci/benchmark_onebot_native_aot.py
          --binary
          "${{ runner.temp }}/cyrene-onebot-v11-native/${{ matrix.rid }}/unpacked/bin/cyrene-onebot-v11"
          --package
          "${{ runner.temp }}/cyrene-onebot-v11-native/${{ matrix.rid }}/cyrene-onebot-v11-native-${{ matrix.rid }}.zip"
          --rid "${{ matrix.rid }}"
          --evidence
          "${{ runner.temp }}/cyrene-onebot-v11-native/${{ matrix.rid }}/performance-evidence.json"
      - name: Upload OneBot Native AOT package evidence
        if: startsWith(matrix.rid, 'linux-')
        uses: actions/upload-artifact@v4
        with:
          name: cyrene-onebot-v11-native-${{ matrix.rid }}-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/cyrene-onebot-v11-native/${{ matrix.rid }}
          if-no-files-found: error
          compression-level: 0

  java-spring:
    name: public-ci / java-spring
    needs:
      - rust-native
      - dotnet-native-aot
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: cyrene-rust-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/cyrene-rust-native
      - uses: actions/download-artifact@v4
        with:
          name: cyrene-dotnet-linux-x64-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/cyrene-dotnet-native-linux-x64
      - name: Restore executable permissions on downloaded native artifacts
        run: |
          chmod +x \
            "${RUNNER_TEMP}/cyrene-rust-native/bin/cyrene-plugin-server" \
            "${RUNNER_TEMP}/cyrene-rust-native/tests/cabi_harness" \
            "${RUNNER_TEMP}/cyrene-dotnet-native-linux-x64/bin/cyrene-plugin-host"
      - name: Build Java client and Spring Boot 3/4 starters
        env:
          CYRENE_RUST_SERVER_BIN: ${{ runner.temp }}/cyrene-rust-native/bin/cyrene-plugin-server
          CYRENE_RUST_CABI_SO: ${{ runner.temp }}/cyrene-rust-native/lib/librust_cyrene_plugin.so
          CYRENE_NATIVE_AOT_HOST: ${{ runner.temp }}/cyrene-dotnet-native-linux-x64/bin/cyrene-plugin-host
        run: mvn --batch-mode --no-transfer-progress clean verify -f sdk/java/pom.xml
      - name: Reject skipped Java tests
        run: python3 tools/ci/assert_no_test_skips.py sdk/java
      - name: Stage Java packages and reports
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/cyrene-java"
          mkdir -p "$output"
          while IFS= read -r -d '' file; do
            relative="${file#sdk/java/}"
            mkdir -p "$output/$(dirname "$relative")"
            cp "$file" "$output/$relative"
          done < <(find sdk/java -type f \( -path '*/target/*.jar' -o -path '*/target/surefire-reports/*.xml' \) -print0)
          test -n "$(find "$output" -type f -print -quit)"
      - name: Upload Java packages and reports
        uses: actions/upload-artifact@v4
        with:
          name: cyrene-java-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/cyrene-java
          if-no-files-found: error
          compression-level: 0

  release-handoff:
    name: public-ci / immutable-release-handoff
    needs:
      - source-hygiene
      - buf-contracts
      - rust-native
      - dotnet-native-aot
      - java-spring
      - onebot-v11-package
      - onebot-v11-python-rollback
      - onebot-v11-python-reference
      - qq-host-tck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: cyrene-rust-*
          path: ${{ runner.temp }}/release-input/rust
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: cyrene-dotnet-*
          path: ${{ runner.temp }}/release-input/dotnet
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          pattern: cyrene-java-*
          path: ${{ runner.temp }}/release-input/java
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: cyrene-source-sbom-*
          path: ${{ runner.temp }}/release-input/sbom/source
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: cyrene-onebot-v11-package-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release-input/onebot-v11
      - uses: actions/download-artifact@v4
        with:
          name: cyrene-onebot-v11-python-rollback-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release-input/onebot-v11-python-rollback
      - uses: actions/download-artifact@v4
        with:
          name: cyrene-onebot-v11-python-reference-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release-input/onebot-v11-python-reference
      - uses: actions/download-artifact@v4
        with:
          pattern: cyrene-onebot-v11-native-*
          path: ${{ runner.temp }}/release-input/onebot-v11-native
          merge-multiple: false
      - name: Generate artifact SBOMs
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/release-input"
          generated="$RUNNER_TEMP/generated-artifact-sbom"
          destination="$input/sbom/artifacts"
          mkdir -p "$generated" "$destination"
          docker run --rm \
            -v "$input:/release-input:ro" \
            -v "$generated:/output" \
            ghcr.io/anchore/syft:v1.51.1@sha256:95fe0835e5bebc6f8b1f8acef68d47d63d594ef4c0f25c097ff853b23cbac74c \
            scan dir:/release-input \
            -o spdx-json=/output/artifacts.spdx.json \
            -o cyclonedx-json=/output/artifacts.cdx.json
          python3 - "$generated" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          spdx = json.loads((root / "artifacts.spdx.json").read_text(encoding="utf-8"))
          cyclonedx = json.loads((root / "artifacts.cdx.json").read_text(encoding="utf-8"))
          if spdx.get("spdxVersion") != "SPDX-2.3" or not spdx.get("packages"):
              raise SystemExit("artifact SPDX SBOM is missing packages")
          if cyclonedx.get("bomFormat") != "CycloneDX" or not cyclonedx.get("components"):
              raise SystemExit("artifact CycloneDX SBOM is missing components")
          PY
          cp "$generated"/*.json "$destination/"
      - name: Assemble immutable Azure handoff
        env:
          RELEASE_ARTIFACT_NAME: cyrene-release-${{ github.sha }}-${{ github.run_id }}
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/release-input"
          output="$RUNNER_TEMP/release-output"
          mkdir -p "$input" "$output"
          cp source-manifest.json "$input/source-manifest.json"
          python3 tools/ci/package_release_artifact.py \
            --input-dir "$input" \
            --output-dir "$output" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --commit-sha "$GITHUB_SHA" \
            --artifact-name "$RELEASE_ARTIFACT_NAME" \
            --abi-version "v1" \
            --contract-version "v1" \
            --rid "multi-rid"
      - name: Upload immutable Azure handoff
        uses: actions/upload-artifact@v4
        with:
          name: cyrene-release-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release-output
          if-no-files-found: error
          compression-level: 0

  qq-real-smoke:
    name: public-ci / qq-real-smoke / linux-x64
    if: github.event_name == 'repository_dispatch' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, qq-real]
    environment:
      name: qq-real-smoke
    timeout-minutes: 45
    env:
      QQNT_HOST_EXECUTABLE: ${{ vars.QQNT_HOST_EXECUTABLE }}
      QQNT_HOST_ARGS_JSON: ${{ vars.QQNT_HOST_ARGS_JSON }}
      QQNT_DATA_DIR: ${{ vars.QQNT_DATA_DIR }}
      QQNT_ACCOUNT_ID: ${{ vars.QQNT_ACCOUNT_ID }}
      QQNT_SMOKE_SCENARIO_PATH: ${{ vars.QQNT_SMOKE_SCENARIO_PATH }}
      QQNT_REAL_SMOKE_APPROVED: ${{ vars.QQNT_REAL_SMOKE_APPROVED }}
      QQNT_REQUIRED_CLIENT_VERSION: ${{ vars.QQNT_REQUIRED_CLIENT_VERSION }}
      QQNT_REQUIRED_HOST_ABI: ${{ vars.QQNT_REQUIRED_HOST_ABI }}
      QQNT_SMOKE_BINDING_ID: qq-real-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify protected Linux x64 runner
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          test -n "$QQNT_HOST_EXECUTABLE"
          test -x "$QQNT_HOST_EXECUTABLE"
          test -n "$QQNT_DATA_DIR"
          test -d "$QQNT_DATA_DIR"
          test -n "$QQNT_SMOKE_SCENARIO_PATH"
          test -f "$QQNT_SMOKE_SCENARIO_PATH"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install direct connector runtime dependencies
        run: |
          python3 -m pip install --disable-pip-version-check \
            'grpcio>=1.62,<1.63' \
            'protobuf>=4.21,<5'
      - name: Run authorized QQNT direct smoke
        env:
          QQNT_SMOKE_EVIDENCE_PATH: ${{ runner.temp }}/qqnt-real-smoke/evidence.json
        run: python3 tools/ci/qqnt_direct_real_smoke.py
      - name: Upload redacted smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyrene-qq-real-smoke-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/qqnt-real-smoke/evidence.json
          if-no-files-found: warn
          compression-level: 0
